[package]
name = "kwaai-provenance-rag"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Observe-only adapter recording kwaai-rag dream-cycle changes as kwaai-provenance lineage"

[dependencies]
kwaai-rag = { workspace = true }
kwaai-provenance = { path = "../kwaai-provenance" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[[bin]]
name = "provenance-report"
path = "src/bin/provenance-report.rs"

[features]
verification = ["kwaai-provenance/ollama", "dep:tokio", "dep:chrono"]

[[bin]]
name = "provenance-verify"
path = "src/bin/provenance-verify.rs"
required-features = ["verification"]
