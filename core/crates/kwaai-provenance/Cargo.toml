[package]
name = "kwaai-provenance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Native provenance primitives for KwaaiNet knowledge: claim/evidence identity, lineage log, policy gate, and JSONL persistence"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Same major as kwaai-rag, so the workspace builds one sha2.
sha2 = "0.10"
hex = "0.4"
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
ollama = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
